[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-ml"
description = "Strategy detectors and LightGBM setup scoring for tradingbot"
requires-python = ">=3.12,<3.13"
dynamic = ["version", "dependencies"]

[tool.setuptools.dynamic]
version = { attr = "momentum_ml.__version__" }
dependencies = { file = ["requirements/inference.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]